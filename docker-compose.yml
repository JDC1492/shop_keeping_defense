# Deliberately vulnerable lab. Ports are bound to 127.0.0.1 on purpose. Do not change that.
# The api/ and web/ Dockerfiles are created by the dev (see docs/BOOTSTRAP.md).
# Credentials below are lab-only fakes.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vulnlab_development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/vulnlab_development
      SEED_PASSWORD: ${SEED_PASSWORD:-Password123!}
      # Both RSpec and Playwright read the same list of still-open findings.
      OPEN_FINDINGS_PATH: /findings/open-findings.json
    volumes:
      - ./findings:/findings:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Rails 7.1+ ships a /up health endpoint. Adjust if the dev uses something else.
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/up || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build: ./web
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
