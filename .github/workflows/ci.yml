name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Start the lab (db, api, web)
        run: docker compose up --build -d --wait

      - name: Seed the database
        run: docker compose exec -T api bin/rails db:seed

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright (api, browser, a11y)
        working-directory: e2e
        run: npx playwright test

      - name: RSpec
        run: |
          docker compose run --rm \
            -e RAILS_ENV=test \
            -e DATABASE_URL=postgres://postgres:postgres@db:5432/vulnlab_test \
            api bash -c "bin/rails db:prepare && bundle exec rspec"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the lab
        if: always()
        run: docker compose down -v
